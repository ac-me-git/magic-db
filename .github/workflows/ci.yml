name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  docker:
    # Builds the image and starts it, without publishing: the Dockerfile cannot rot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t magic-db:ci .
      - name: The container starts, is healthy and runs as non-root
        run: |
          docker run -d --name magic-db -e MAGICDB_SCHEDULER=off -p 8080:8080 magic-db:ci
          for attempt in $(seq 1 30); do
            sleep 1
            if curl -fsS http://127.0.0.1:8080/healthz; then ok=1; break; fi
          done
          docker logs magic-db
          test "${ok:-0}" = 1
          test "$(docker exec magic-db id -u)" != 0
          curl -fsS http://127.0.0.1:8080/ | grep -q "AMTG"
          curl -fsS http://127.0.0.1:8080/static/app.css > /dev/null
          curl -fsS http://127.0.0.1:8080/syntax > /dev/null
      - name: An image built with a commit says it is a development version
        run: |
          if curl -fsS http://127.0.0.1:8080/admin | grep -q "development version"; then
            echo "an image built without a commit calls itself a development version"
            exit 1
          fi
          docker rm -f magic-db
          docker build --build-arg REVISION=${{ github.sha }} -t magic-db:ci-edge .
          docker run -d --name magic-db -e MAGICDB_SCHEDULER=off -e MAGICDB_UPDATE_CHECK=off -p 8080:8080 magic-db:ci-edge
          for attempt in $(seq 1 30); do
            sleep 1
            if curl -fsS http://127.0.0.1:8080/healthz; then ok=1; break; fi
          done
          test "${ok:-0}" = 1
          curl -fsS http://127.0.0.1:8080/admin | grep -q "development version, commit ${GITHUB_SHA:0:7}"

  edge:
    # The development version: every change on main that passes the two jobs above is
    # published as the ":edge" image, so that it can be tried on a real server before it
    # is released. Releases are separate (release.yml): only a tag writes ":latest" and
    # the version tags.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: edge-image
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:edge
          build-args: |
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=edge
