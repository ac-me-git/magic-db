<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMTG logo</title>
<link rel="icon" href="icon.svg">
<style>
  body { margin: 0; font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  section { padding: 24px 16px; }
  .light { background: #fafaf8; color: #5d5a6b; }
  .dark { background: #15141b; color: #a3a0b4; }
  .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 28px; margin: 0 0 28px; }
  figure { margin: 0; }
  figcaption { font-size: 12px; margin-top: 6px; }
  .zoom { image-rendering: pixelated; }
  img { display: block; max-width: 100%; }
</style>
</head>
<body>
<section class="light">
  <div class="row">
    <figure><img src="icon.svg" width="128" height="128" alt=""><figcaption>icon.svg 128</figcaption></figure>
    <figure><img src="icon.svg" width="64" height="64" alt=""><figcaption>64</figcaption></figure>
    <figure><img src="icon.svg" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
    <figure><img src="icon.svg" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
    <figure><img class="zoom" src="png/icon-16.png" width="96" height="96" alt=""><figcaption>icon-16.png ×6</figcaption></figure>
    <figure><img class="zoom" src="png/icon-24.png" width="96" height="96" alt=""><figcaption>icon-24.png ×4</figcaption></figure>
    <figure><img class="zoom" src="png/icon-32.png" width="96" height="96" alt=""><figcaption>icon-32.png ×3</figcaption></figure>
    <figure><img src="icon-dark.svg" width="64" height="64" alt=""><figcaption>icon-dark.svg</figcaption></figure>
    <figure><img src="mark-light.svg" height="64" alt=""><figcaption>mark-light.svg</figcaption></figure>
  </div>
  <div class="row"><figure><img src="amtg-light.svg" height="72" alt=""><figcaption>amtg-light.svg</figcaption></figure>
    <figure><img src="amtg-light.svg" height="32" alt=""><figcaption>32 px</figcaption></figure></div>
  <div class="row"><figure><img src="amtg-fans-light.svg" height="72" alt=""><figcaption>amtg-fans-light.svg</figcaption></figure></div>
  <div class="row"><figure><img src="full-name-light.svg" height="72" alt=""><figcaption>full-name-light.svg</figcaption></figure></div>
  <div class="row"><figure><img src="full-name-line-light.svg" height="40" alt=""><figcaption>full-name-line-light.svg</figcaption></figure></div>
</section>
<section class="dark">
  <div class="row">
    <figure><img src="icon.svg" width="64" height="64" alt=""><figcaption>icon.svg</figcaption></figure>
    <figure><img src="icon-dark.svg" width="64" height="64" alt=""><figcaption>icon-dark.svg 64</figcaption></figure>
    <figure><img src="icon-dark.svg" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
    <figure><img src="mark-dark.svg" height="64" alt=""><figcaption>mark-dark.svg</figcaption></figure>
  </div>
  <div class="row"><figure><img src="amtg-dark.svg" height="72" alt=""><figcaption>amtg-dark.svg</figcaption></figure></div>
  <div class="row"><figure><img src="amtg-fans-dark.svg" height="72" alt=""><figcaption>amtg-fans-dark.svg</figcaption></figure></div>
  <div class="row"><figure><img src="full-name-dark.svg" height="72" alt=""><figcaption>full-name-dark.svg</figcaption></figure></div>
  <div class="row"><figure><img src="full-name-line-dark.svg" height="40" alt=""><figcaption>full-name-line-dark.svg</figcaption></figure></div>
</section>
</body>
</html>
