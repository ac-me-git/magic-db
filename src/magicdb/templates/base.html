<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t("app.name") }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">{{ t("app.name") }}</a>
    <form class="search-box" action="/search" method="get" role="search">
      <input type="search" name="q" value="{{ q | default('') }}"
             placeholder="{{ t('search.placeholder') }}" aria-label="{{ t('search.button') }}"
             autocomplete="off" autocapitalize="off" spellcheck="false">
      {% if view is defined and view != "grid" %}<input type="hidden" name="view" value="{{ view }}">{% endif %}
      <button type="submit">{{ t("search.button") }}</button>
    </form>
    <nav class="site-nav">
      <a href="/">{{ t("nav.filters") }}</a>
      <a href="/syntax">{{ t("nav.syntax") }}</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>{{ t("footer.data") }}</p>
    <p>{{ t("footer.legal") }}</p>
  </footer>
</body>
</html>
