[project]
name = "magic-db"
version = "1.1.0"
description = "Self-hosted Magic: The Gathering card browser and collection tracker"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "ijson>=3.3",
    "rapidfuzz>=3.9",
    "python-multipart>=0.0.9",
]

[project.scripts]
magicdb = "magicdb.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magicdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# test data (CSV rows, expected tuples) reads better on one line
"tests/*" = ["E501"]
